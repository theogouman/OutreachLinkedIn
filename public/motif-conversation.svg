<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- Motif original (dessiné pour OutreachLinkedIn) : petits dessins au trait, répétés en mosaïque. -->
  <g fill="none" stroke="#d6cdbf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- bulle de discussion -->
    <g transform="translate(18 20) rotate(-8)">
      <path d="M2 4h26a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H14l-7 6v-6H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/>
      <path d="M9 12h16M9 17h10"/>
    </g>
    <!-- avion en papier -->
    <g transform="translate(92 14) rotate(12)">
      <path d="M2 14 34 2 24 32l-8-11z"/><path d="M16 21 34 2"/>
    </g>
    <!-- cœur -->
    <g transform="translate(168 26) rotate(-14)">
      <path d="M14 26S2 18 2 10a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 8-12 16-12 16z"/>
    </g>
    <!-- étoile -->
    <g transform="translate(232 12) rotate(10)">
      <path d="m14 2 3.6 7.6 8.4 1.1-6.1 5.8 1.5 8.3L14 20.8l-7.4 4 1.5-8.3L2 10.7l8.4-1.1z"/>
    </g>
    <!-- enveloppe -->
    <g transform="translate(40 80) rotate(6)">
      <rect x="2" y="4" width="30" height="21" rx="3"/><path d="m3 6 14 11L31 6"/>
    </g>
    <!-- tasse -->
    <g transform="translate(118 74) rotate(-6)">
      <path d="M4 10h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z"/><path d="M24 13h3a4 4 0 0 1 0 8h-3M10 2c-2 2 2 4 0 6M16 2c-2 2 2 4 0 6"/>
    </g>
    <!-- nuage -->
    <g transform="translate(186 86)">
      <path d="M10 26h20a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 10 26z"/>
    </g>
    <!-- note de musique -->
    <g transform="translate(250 70) rotate(-10)">
      <path d="M8 24V4l14-2v18"/><circle cx="5" cy="24" r="3.5"/><circle cx="19" cy="20" r="3.5"/>
    </g>
    <!-- sourire -->
    <g transform="translate(14 146)">
      <circle cx="14" cy="14" r="12"/><path d="M9 17c2.5 3 7.5 3 10 0"/><path d="M10 10v1M18 10v1"/>
    </g>
    <!-- horloge -->
    <g transform="translate(80 140) rotate(8)">
      <circle cx="14" cy="14" r="12"/><path d="M14 7v7l5 3"/>
    </g>
    <!-- éclair -->
    <g transform="translate(146 136) rotate(-12)">
      <path d="M16 2 4 18h9l-3 12 12-17h-9z"/>
    </g>
    <!-- feuille -->
    <g transform="translate(200 146) rotate(18)">
      <path d="M4 28C4 12 14 4 30 4c0 16-10 24-26 24z"/><path d="M4 28 20 12"/>
    </g>
    <!-- appareil photo -->
    <g transform="translate(36 210) rotate(-8)">
      <rect x="2" y="8" width="30" height="20" rx="4"/><path d="M11 8l3-5h6l3 5"/><circle cx="17" cy="18" r="5"/>
    </g>
    <!-- trombone -->
    <g transform="translate(110 204) rotate(24)">
      <path d="M20 8 9 19a4 4 0 0 0 6 6l12-12a7 7 0 0 0-10-10L5 15a10 10 0 0 0 14 14l9-9"/>
    </g>
    <!-- lune -->
    <g transform="translate(176 214)">
      <path d="M24 20A12 12 0 1 1 12 4a9 9 0 0 0 12 16z"/>
    </g>
    <!-- poignée de main simplifiée : deux bulles -->
    <g transform="translate(234 196) rotate(-6)">
      <path d="M2 4h16a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-4 4v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
      <path d="M24 12h4a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-1v4l-4-4h-6a3 3 0 0 1-3-3"/>
    </g>
    <!-- petits points de remplissage -->
    <circle cx="70" cy="58" r="1.5"/><circle cx="150" cy="58" r="1.5"/><circle cx="224" cy="58" r="1.5"/>
    <circle cx="100" cy="118" r="1.5"/><circle cx="240" cy="128" r="1.5"/><circle cx="56" cy="186" r="1.5"/>
    <circle cx="140" cy="188" r="1.5"/><circle cx="214" cy="190" r="1.5"/><circle cx="84" cy="262" r="1.5"/>
    <circle cx="160" cy="262" r="1.5"/><circle cx="16" cy="258" r="1.5"/><circle cx="266" cy="256" r="1.5"/>
    <!-- plus -->
    <path d="M262 150v8M258 154h8M8 104v8M4 108h8M152 106v8M148 110h8"/>
