# Revue sécurité de chaque PR par Claude (non bloquante : commentaires lus avant merge).
# Garde-fous, l'action n'étant pas durcie contre l'injection de prompt :
#   - déclencheur pull_request (jamais pull_request_target) et PR venant de forks ignorées ;
#   - action épinglée par SHA de commit ;
#   - permissions minimales, accordées au job seulement.
# Prérequis : secret de repo ANTHROPIC_API_KEY. Modèle optionnel : variable SECURITY_REVIEW_MODEL.
name: Revue sécurité Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revue sécurité
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANTHROPIC_API_KEY absent : revue sécurité Claude ignorée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - if: steps.check.outputs.enabled == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-11-06
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: ${{ vars.SECURITY_REVIEW_MODEL }}
          comment-pr: true
          exclude-directories: .claude/skills,node_modules
